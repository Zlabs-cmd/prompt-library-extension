            --restricted --tools "Read,Glob,Grep" --permission-mode dontAsk --add-dir "$REVIEW_DIR" \
            --model "$REVIEW_MODEL" --max-turns "$REVIEW_MAX_TURNS" --max-budget-usd "$REVIEW_MAX_BUDGET_USD" \
