            -H 'anthropic-version: 2023-06-01' \
            -H 'content-type: application/json' \
            -d "{\"model\":\"$REVIEW_MODEL\",\"max_tokens\":16,\"messages\":[{\"role\":\"user\",\"content\":\"credit probe\"}]}") || status=000
          if [ "$status" != 401 ] && grep -qiE 'credit balance is too low|reached your specified( workspace)? API usage limits' "$body"; then
            echo 'skip_reason=no_credits' >> "$GITHUB_OUTPUT"
            {
              echo "### ${GITHUB_JOB} skipped: Anthropic credits exhausted"
              echo
              echo "The agent review could not run because the Anthropic organization has"
              echo "no API credits or has reached its spend limit (proven by a live probe,"
              echo "HTTP $status). Per the owner's standing direction (2026-08-24, issue #629)"
              echo "a proven credits outage does not block the pipeline."
              echo
              echo "**NO agent review happened on this PR.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Agent review skipped::${GITHUB_JOB} skipped: Anthropic org out of credits. No review was performed on this PR."
            exit 0
          fi
          echo 'skip_reason=' >> "$GITHUB_OUTPUT"
          echo "::error title=Agent review failed::${GITHUB_JOB} failed and the failure is not a proven credits outage (probe HTTP $status)."
          exit 1

  policy:
    if: always()
    needs:
      [classify, agent_correctness, agent_security, agent_reliability_finops]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      effective_risk: ${{ steps.gate.outputs.effective_risk }}
    steps:
      - if: github.event_name == 'merge_group'
        run: echo 'Merge-group event observed; repository-required checks must revalidate the queued merge group.'
      - if: github.event_name == 'pull_request'
        id: gate
        env:
          BASE_RISK: ${{ needs.classify.outputs.risk }}
          CORRECTNESS_AVAILABLE: ${{ needs.agent_correctness.outputs.available }}
          CORRECTNESS: ${{ needs.agent_correctness.outputs.result }}
          CORRECTNESS_SKIP: ${{ needs.agent_correctness.outputs.skip_reason }}
          SECURITY_AVAILABLE: ${{ needs.agent_security.outputs.available }}
          SECURITY: ${{ needs.agent_security.outputs.result }}
          SECURITY_SKIP: ${{ needs.agent_security.outputs.skip_reason }}
          RELIABILITY_AVAILABLE: ${{ needs.agent_reliability_finops.outputs.available }}
          RELIABILITY: ${{ needs.agent_reliability_finops.outputs.result }}
          RELIABILITY_SKIP: ${{ needs.agent_reliability_finops.outputs.skip_reason }}
        run: |
          set -euo pipefail
          rank() { case "$1" in AM0) echo 0;; AM1) echo 1;; AM2) echo 2;; AM3) echo 3;; AM4) echo 4;; *) echo 4;; esac; }
          effective="$BASE_RISK"
          decision=PASS
          degraded=false

          require_json_pass() {
            local available="$1" payload="$2" label="$3" skip="${4:-}"
            if [ "$skip" = no_credits ]; then
              # Owner-approved bypass (2026-08-24, issue #629): a PROVEN Anthropic
              # credits outage does not block the gate. The decision downgrades to
              # PASS_NO_AGENT below so merge_guard never auto-merges unreviewed work.
              echo "$label agent review skipped: Anthropic credits exhausted (owner bypass, issue #629)" >&2
              degraded=true
              return
            fi
            if [ "$available" != true ] || [ -z "$payload" ]; then
              echo "$label agent review unavailable" >&2
              decision=BLOCKED_NO_AGENT
              return
            fi
            local verdict agent_risk
            verdict=$(printf '%s' "$payload" | jq -r '.verdict // "INVALID"' 2>/dev/null || echo INVALID)
            agent_risk=$(printf '%s' "$payload" | jq -r '.risk // "AM4"' 2>/dev/null || echo AM4)
            if [ "$(rank "$agent_risk")" -gt "$(rank "$effective")" ]; then effective="$agent_risk"; fi
            if [ "$verdict" != PASS ]; then decision=BLOCKED; fi
          }

          case "$BASE_RISK" in
            AM0) ;;
            AM1)
              require_json_pass "$CORRECTNESS_AVAILABLE" "$CORRECTNESS" correctness "$CORRECTNESS_SKIP"
              ;;
            AM2)
              require_json_pass "$CORRECTNESS_AVAILABLE" "$CORRECTNESS" correctness "$CORRECTNESS_SKIP"
              require_json_pass "$SECURITY_AVAILABLE" "$SECURITY" security "$SECURITY_SKIP"
              require_json_pass "$RELIABILITY_AVAILABLE" "$RELIABILITY" reliability_finops "$RELIABILITY_SKIP"
              ;;
            AM3|AM4)
              decision=HUMAN_REQUIRED
              if [ "$CORRECTNESS_AVAILABLE" = true ]; then require_json_pass "$CORRECTNESS_AVAILABLE" "$CORRECTNESS" correctness "$CORRECTNESS_SKIP" || true; fi
              if [ "$SECURITY_AVAILABLE" = true ]; then require_json_pass "$SECURITY_AVAILABLE" "$SECURITY" security "$SECURITY_SKIP" || true; fi
              if [ "$RELIABILITY_AVAILABLE" = true ]; then require_json_pass "$RELIABILITY_AVAILABLE" "$RELIABILITY" reliability_finops "$RELIABILITY_SKIP" || true; fi
              decision=HUMAN_REQUIRED
              ;;
          esac

          if [ "$(rank "$effective")" -ge 3 ]; then decision=HUMAN_REQUIRED; fi
          if [ "$decision" = PASS ] && [ "$degraded" = true ]; then decision=PASS_NO_AGENT; fi

          echo "decision=$decision" >> "$GITHUB_OUTPUT"
          echo "effective_risk=$effective" >> "$GITHUB_OUTPUT"
          echo "### Portfolio PR gate" >> "$GITHUB_STEP_SUMMARY"
          echo "Base risk: **$BASE_RISK**" >> "$GITHUB_STEP_SUMMARY"
          echo "Effective risk: **$effective**" >> "$GITHUB_STEP_SUMMARY"
          echo "Decision: **$decision**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$decision" = PASS_NO_AGENT ]; then
            echo 'Agent reviews were skipped for a proven Anthropic credits outage (owner bypass, issue #629). No autonomous merge is requested for unreviewed work.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$decision" != PASS ] && [ "$decision" != PASS_NO_AGENT ]; then exit 1; fi

  merge_guard:
    needs: [classify, policy]
    if: ${{ always() && github.event_name == 'pull_request' && needs.policy.outputs.decision == 'PASS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      BASE_RISK: ${{ needs.classify.outputs.risk }}
    steps:
      - name: Revalidate risk, exact PR, and opt-out boundary
        run: |
          set -euo pipefail
          case "$BASE_RISK" in
            AM0|AM1|AM2) ;;
            *) echo "Risk $BASE_RISK is not autonomously mergeable." >&2; exit 1 ;;
          esac

          pr_json=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state,isDraft,headRefOid,title,body,labels)
          state=$(printf '%s' "$pr_json" | jq -r '.state')
          draft=$(printf '%s' "$pr_json" | jq -r '.isDraft')
          head=$(printf '%s' "$pr_json" | jq -r '.headRefOid')
          title=$(printf '%s' "$pr_json" | jq -r '.title // ""')
          body=$(printf '%s' "$pr_json" | jq -r '.body // ""')
          labels=$(printf '%s' "$pr_json" | jq -r '[.labels[].name] | join(" ")')

          if [ "$state" != OPEN ] || [ "$draft" != false ]; then
            echo 'PR is not an open, ready-for-review candidate.' >&2
            exit 1
          fi
          if [ "$head" != "$EXPECTED_HEAD" ]; then
            echo 'PR head moved after review; refusing stale merge.' >&2
            exit 1
          fi

          metadata=$(printf '%s\n%s\n%s\n' "$title" "$body" "$labels" | tr '[:lower:]' '[:upper:]')
          if printf '%s' "$metadata" | grep -Eq 'DO[ -]?NOT[ -]?(SHIP|MERGE)|NO[ -]?(AUTO|AUTOMATIC)[ -]?MERGE|NEVER[ -]?AUTO[ -]?MERGE|HUMAN[ -]?(APPROVAL|REVIEW)[ -]?REQUIRED|RELEASE[ -]?(OWNER|APPROVAL)|SECURITY[ -]?APPROVAL|FINANCE[ -]?APPROVAL|PRIVACY[ -]?APPROVAL'; then
            echo 'Explicit human/release opt-out detected; refusing autonomous merge.' >&2
            exit 1
          fi

      - name: Merge without bypassing GitHub governance
        run: |
          set -euo pipefail
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$EXPECTED_HEAD"; then
            echo 'GitHub native auto-merge requested; repository protections remain authoritative.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'Native auto-merge unavailable; attempting a normal squash merge without --admin.' >> "$GITHUB_STEP_SUMMARY"
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$EXPECTED_HEAD"; then
            echo 'PR merged after GitHub accepted all applicable branch/ruleset requirements.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo 'GitHub rejected the merge. Failing closed; pending checks/reviews/rules remain authoritative.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
