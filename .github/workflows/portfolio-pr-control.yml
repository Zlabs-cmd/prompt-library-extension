name: Portfolio PR Control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write
  pull-requests: write

jobs:
  control:
    uses: Zlabs-cmd/prompt-library-extension/.github/workflows/portfolio-pr-control-reusable.yml@d380bd9c50c4ef82adb399cedae8b3d373c5dc9c
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
