name: Portfolio PR Control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write
  pull-requests: write

jobs:
  control:
    uses: Zlabs-cmd/prompt-library-extension/.github/workflows/portfolio-pr-control-reusable.yml@ca9b74d4cf2c96b855eba25afb2f37906e7af2d9
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
