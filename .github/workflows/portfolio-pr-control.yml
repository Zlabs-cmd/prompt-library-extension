name: Portfolio PR Control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write
  pull-requests: write

jobs:
  control:
    uses: Zlabs-cmd/prompt-library-extension/.github/workflows/portfolio-pr-control-reusable.yml@51e041b54533d5fe01ec9ced151fa5c07cc6754c
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
