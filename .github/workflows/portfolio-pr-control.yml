name: Portfolio PR Control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write
  pull-requests: write

jobs:
  control:
    uses: Zlabs-cmd/prompt-library-extension/.github/workflows/portfolio-pr-control-reusable.yml@89d501db7265de9b3a8f8a20f1e05d09d7bc8596
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
