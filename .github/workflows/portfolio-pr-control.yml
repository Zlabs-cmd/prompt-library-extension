name: Portfolio PR Control

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: write
  pull-requests: write

jobs:
  control:
    uses: Zlabs-cmd/prompt-library-extension/.github/workflows/portfolio-pr-control-reusable.yml@0775d8c3ce887b631dfbca1b9216af9a03128d77
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
